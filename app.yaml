# Databricks App configuration -- Phase 1.
#
# Deploy from the Databricks UI (Compute -> Apps -> Create app -> deploy
# from a Git folder). Databricks reads this file for the start command and
# environment variables.
#
# Credentials (Lakebase URL, Adzuna, USAJobs) are NOT set here as plain
# values -- they're resolved inside the Python code via
# WorkspaceClient().secrets.get_secret(), the same pattern lakebase.py uses
# for the Lakebase URL (see secrets_helper.py). Only the secret scope name
# is configured below; the scope/key values themselves are set once with
# setup_secrets.py and never appear in this file or in git.
#
# The app's service principal needs READ on the "database" secret scope:
#   databricks secrets put-acl database <app-service-principal> READ

command:
  - "python"
  - "app.py"

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"

  - name: ADZUNA_COUNTRY
    value: "us"

  # Default harvest behavior when POST /jobs/sync is called with no body.
  - name: JOB_SEARCH_QUERIES
    value: "software engineer;data engineer;machine learning engineer"
  - name: JOB_SEARCH_LOCATION
    value: ""
  - name: JOB_SYNC_LIMIT
    value: "50"
